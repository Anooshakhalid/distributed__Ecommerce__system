<h1>Orders</h1>

<div id="orders"></div>

<script>
fetch("/orders")
.then(res => res.json())
.then(data => {
    let html = "";

    data.forEach(o => {
        html += `
        <div>
            <p>Order ${o.id}</p>
            <button onclick="pay(${o.id})">Pay</button>
        </div>`;
    });

    document.getElementById("orders").innerHTML = html;
});

function pay(id) {
    window.location.href = "/payment-page?order_id=" + id;
}
</script>
